<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>
</head>

<body>

<h2>Basic Calculator</h2>

Num 1:
<input type="text" id="a"><br><br>

Num 2:
<input type="text" id="b"><br><br>

<input type="button" value="+" onclick="setOp('+')">
<input type="button" value="-" onclick="setOp('-')">
<input type="button" value="*" onclick="setOp('*')">
<input type="button" value="/" onclick="setOp('/')">

<p id="op"></p>

<input type="button" value="Submit" onclick="calculate()">

<p id="res"></p>

<script>

var operator = "";

function setOp(x) {
    operator = x;
    document.getElementById("op").innerHTML = "Selected: " + operator;
}

function calculate() {
    var n1 = Number(document.getElementById("a").value);
    var n2 = Number(document.getElementById("b").value);
    var result;

    if (operator == "+") {
        result = n1 + n2;
    } 
    else if (operator == "-") {
        result = n1 - n2;
    } 
    else if (operator == "*") {
        result = n1 * n2;
    } 
    else if (operator == "/") {
        result = n1 / n2;
    }

    document.getElementById("res").innerHTML = result;
}

</script>

</body>
</html>
